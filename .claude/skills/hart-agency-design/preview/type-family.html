<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./tokens.css" />
    <script>
      (() => {
        const MESSAGE_TYPE = "hart-ds-iframe-height";
        const measureHeight = (doc) =>
          Math.ceil(doc.documentElement.getBoundingClientRect().height);
        const postHeight = (height) => {
          if (window.parent === window) return;
          window.parent.postMessage({ type: MESSAGE_TYPE, height }, "*");
        };
        let scheduled = false;
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            postHeight(measureHeight(document));
          });
        };
        document.documentElement.style.overflow = "hidden";
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
        document.fonts?.ready?.then(schedule);
        new ResizeObserver(schedule).observe(document.documentElement);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: "Inter", sans-serif;
      }
      .card {
        padding: 20px 24px;
        box-sizing: border-box;
        background: transparent;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d152d;
        font-weight: 600;
        margin: 0 0 12px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-family: Inter, sans-serif; color: #111827">
        <div
          style="
            font-size: 44px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.01em;
          "
        >
          Inter
        </div>
        <div
          style="
            font-size: 13px;
            color: #111827;
            margin-top: 10px;
            line-height: 1.5;
            opacity: 0.72;
          "
        >
          The single UI family. Weights 400 / 500 / 600 in active use; 700
          reserved for hard emphasis.
        </div>
        <div
          style="
            display: flex;
            gap: 18px;
            margin-top: 14px;
            font-size: 18px;
            color: #111827;
          "
        >
          <span style="font-weight: 400">Regular 400</span>
          <span style="font-weight: 500">Medium 500</span>
          <span style="font-weight: 600">Semibold 600</span>
          <span style="font-weight: 700">Bold 700</span>
        </div>
      </div>
    </div>
  </body>
</html>
