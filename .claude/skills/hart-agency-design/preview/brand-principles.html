<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./tokens.css" />
    <script>
      (() => {
        const MESSAGE_TYPE = "hart-ds-iframe-height";
        const measureHeight = (doc) =>
          Math.ceil(doc.documentElement.getBoundingClientRect().height);
        const postHeight = (height) => {
          if (window.parent === window) return;
          window.parent.postMessage({ type: MESSAGE_TYPE, height }, "*");
        };
        let scheduled = false;
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            postHeight(measureHeight(document));
          });
        };
        document.documentElement.style.overflow = "hidden";
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
        document.fonts?.ready?.then(schedule);
        new ResizeObserver(schedule).observe(document.documentElement);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: "Inter", sans-serif;
      }
      .card {
        padding: 20px 24px;
        box-sizing: border-box;
        background: transparent;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .swatch {
        width: 78px;
      }
      .swatch .chip {
        height: 54px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .swatch .label {
        font-size: 11px;
        color: #111827;
        margin-top: 6px;
        font-weight: 500;
        line-height: 1.2;
      }
      .swatch .hex {
        font-size: 10px;
        color: rgba(125, 21, 45, 0.75);
        font-family: ui-monospace, Menlo, monospace;
        line-height: 1.4;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d152d;
        font-weight: 600;
        margin: 0 0 12px 0;
      }
      .mono {
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div
        style="
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px 20px;
          color: #111827;
          font-size: 13px;
        "
      >
        <div>
          <strong style="font-weight: 600">Aesthetic</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >Flat, border-based.</span
          >
        </div>
        <div>
          <strong style="font-weight: 600">Elevation</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >Shadows on overlays only.</span
          >
        </div>
        <div>
          <strong style="font-weight: 600">Alignment</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >Left-aligned by default.</span
          >
        </div>
        <div>
          <strong style="font-weight: 600">Borders</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >1px solid #E5E7EB.</span
          >
        </div>
        <div>
          <strong style="font-weight: 600">Brand</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >One color: Hart Burgundy.</span
          >
        </div>
        <div>
          <strong style="font-weight: 600">Density</strong><br /><span
            style="color: rgba(17, 24, 39, 0.58)"
            >Comfortable (24px padding).</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
